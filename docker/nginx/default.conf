server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # ---------------------------------------------------------------
    # FUTURE: uncomment when a load balancer / proxy is added in front.
    # Trust ONLY the LB's subnet or IP, never all private ranges.
    # ---------------------------------------------------------------
    # set_real_ip_from 10.0.1.0/24;
    # real_ip_header X-Forwarded-For;     # CF-Connecting-IP for Cloudflare
    # real_ip_recursive on;
    # ---------------------------------------------------------------

    location = /ws {
        default_type text/plain;
        return 404;
    }

    location = /sw.js {
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # $remote_addr = real TCP peer today; becomes the real client IP
        # automatically once the realip block above is enabled.
        fastcgi_param HTTP_X_REAL_IP         $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR   $remote_addr;

        # FUTURE (LB terminates TLS): change to $http_x_forwarded_proto
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST  $host;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}