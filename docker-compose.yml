services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: cg-net-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            APP_URL: http://localhost:${NGINX_PORT:-8080}
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-cg_net}
            DB_USERNAME: ${DB_USERNAME:-cgnet}
            DB_PASSWORD: ${DB_PASSWORD:-secret}
            REDIS_HOST: redis
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            BROADCAST_CONNECTION: reverb
            REVERB_HOST: reverb
            REVERB_PORT: 8081
            REVERB_SCHEME: http
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started

    nginx:
        image: nginx:1.27-alpine
        container_name: cg-net-nginx
        restart: unless-stopped
        ports:
            - "${NGINX_PORT:-8080}:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    vite:
        image: node:22-bookworm
        container_name: cg-net-vite
        restart: unless-stopped
        working_dir: /var/www/html
        ports:
            - "${VITE_PORT:-5173}:5173"
        volumes:
            - .:/var/www/html
        environment:
            VITE_PORT: ${VITE_PORT:-5173}
            VITE_DEV_SERVER_URL: http://localhost:${VITE_PORT:-5173}
            VITE_REVERB_ENABLED: ${VITE_REVERB_ENABLED:-false}
            VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-cgnet-reverb-key}
            VITE_REVERB_HOST: localhost
            VITE_REVERB_PORT: ${REVERB_PORT:-8081}
            VITE_REVERB_SCHEME: ${REVERB_SCHEME:-http}
            CHOKIDAR_USEPOLLING: "true"
            WATCHPACK_POLLING: "true"
        command: ["npm", "run", "dev"]

    reverb:
        profiles: ["reverb"]
        build:
            context: .
            dockerfile: Dockerfile
        container_name: cg-net-reverb
        restart: unless-stopped
        working_dir: /var/www/html
        command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8081"]
        ports:
            - "${FORWARD_REVERB_PORT:-8081}:8081"
        volumes:
            - .:/var/www/html
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            APP_URL: http://localhost:${NGINX_PORT:-8080}
            REDIS_HOST: redis
            REVERB_SERVER_HOST: 0.0.0.0
            REVERB_SERVER_PORT: 8081
            REVERB_HOST: localhost
            REVERB_PORT: 8081
            REVERB_SCHEME: http
        depends_on:
            redis:
                condition: service_started

    mysql:
        image: mysql:8.4
        container_name: cg-net-mysql
        restart: unless-stopped
        ports:
            - "${FORWARD_DB_PORT:-3306}:3306"
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-cg_net}
            MYSQL_USER: ${DB_USERNAME:-cgnet}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        image: redis:7-alpine
        container_name: cg-net-redis
        restart: unless-stopped
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        command: ["redis-server", "--appendonly", "yes"]

volumes:
    mysql_data:
    redis_data:
